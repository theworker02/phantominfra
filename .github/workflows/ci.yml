name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # runtime dist is required before adapters (and workspace) tests resolve @phantominfra/runtime
      - run: npm run build -w @phantominfra/runtime
      - run: npm test
      - run: npm run build
      - run: npm run bench -w @phantominfra/runtime
