openapi: 3.1.0
info:
  title: PhantomInfra Edge API
  version: 0.5.0
  description: >
    Speculative zero-latency edge engine. Predict routes or agent tools,
    pre-execute on COW branches, commit on hit or roll back on miss.
servers:
  - url: http://127.0.0.1:8787
    description: Local wrangler
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness + global predictor stats
      responses:
        "200":
          description: OK
  /openapi.json:
    get:
      security: []
      summary: This OpenAPI document
      responses:
        "200":
          description: OpenAPI JSON
  /v1/predictor:
    get:
      summary: Global KV predictor mesh stats
      responses:
        "200":
          description: Mesh stats + rate remaining
        "401":
          description: Unauthorized
        "429":
          description: Rate limited
  /v1/sessions:
    post:
      summary: Create a sticky speculation session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
      responses:
        "200":
          description: Session created
  /v1/sessions/{id}:
    get:
      summary: Session status, branches, metrics, ledger
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session view
  /v1/sessions/{id}/speculate:
    post:
      summary: Speculate from surface/history priors
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                surface:
                  type: string
                history:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Open branches
  /v1/sessions/{id}/confirm:
    post:
      summary: Confirm a route (hit commit or cold path)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route]
              properties:
                route:
                  type: string
                payload: {}
      responses:
        "200":
          description: Confirm result
  /v1/sessions/{id}/agent/plan:
    post:
      summary: Speculate from an agent plan
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: object
      responses:
        "200":
          description: Tool branches
  /v1/sessions/{id}/events:
    get:
      summary: SSE live event stream
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: text/event-stream
  /v1/sessions/{id}/metrics:
    get:
      summary: Session metrics only
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Metrics
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from wrangler vars API_KEYS (default local key dev_phantom_key)
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
